line-length = 79
target-version = "py312"

[lint]
select = ["E", "W", "F", "I", "UP"]

[lint.isort]
known-first-party = [
  "service",
  "schemas",
  "models",
  "bus",
  "handlers",
  "routes",
  "utils"
]
known-third-party = ["playwright"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder"
]
